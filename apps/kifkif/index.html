<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KifKif">

<body>
<title>KifKif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0a0b">
<style>
/* Layout: one dark column in the KifKif black-and-gold identity; sticky bottom bar shows the share per person */
:root{
  --bg:#0a0a0b; --card:#151413; --field:#0f0e0d; --ink:#f4f1ea; --muted:#a8a091; --line:#2e2a22;
  --gold:#f0b92a; --gold-hi:#ffe9a0; --gold-lo:#b07d0f; --silver:#e9e9ec; --danger:#ff7a5c;
  --goldgrad:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 120% 40% at 50% 0%,rgba(240,185,42,.14),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 160px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:14px;padding:4px 0 6px}
header img{width:72px;height:72px;border-radius:18px;flex:none;box-shadow:0 0 0 1px rgba(240,185,42,.5),0 6px 24px rgba(240,185,42,.25)}
header h1{margin:0;font-size:2rem;font-weight:900;font-style:italic;letter-spacing:-.02em;line-height:1}
header h1 .k1{color:var(--silver)}
header h1 .k2{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding-right:.14em}
header p{margin:6px 0 0;color:var(--ink);font-style:italic;font-weight:600;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{margin:0;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--silver);font-weight:800;display:flex;align-items:center;gap:10px}
h2 .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  border:1px solid rgba(240,185,42,.55);background:linear-gradient(180deg,#1f1b12,#0d0c0a);box-shadow:inset 0 1px 0 rgba(255,233,160,.15)}
h2 .ico svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}
label{display:grid;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
input{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:12px;padding:12px;width:100%;min-width:0}
input::placeholder{color:#6b655a}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,185,42,.18)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.unit{position:relative}
.unit input{padding-right:64px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--field);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{font:inherit;font-size:.95rem;font-weight:600;border:0;border-radius:10px;padding:10px 4px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--goldgrad);color:#1a1100;font-weight:800;box-shadow:0 2px 10px rgba(240,185,42,.3)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-size:.95rem}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:#2c2922;
  position:relative;padding:0;border:0;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--silver);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.switch input:checked{background:var(--goldgrad)}
.switch input:checked::after{transform:translateX(20px);background:#fff}
.switch input:focus{box-shadow:0 0 0 3px rgba(240,185,42,.25)}
.calc{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.7}
.calc b{color:var(--ink)}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center}
.item input{padding:10px}
.del{font:inherit;border:0;background:transparent;color:var(--danger);font-size:1.4rem;height:40px;border-radius:10px;cursor:pointer}
.add{font:inherit;font-weight:800;border:1.5px dashed rgba(240,185,42,.5);background:transparent;color:var(--gold);padding:12px;border-radius:14px;cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{font:inherit;font-size:1.7rem;font-weight:700;width:58px;height:58px;border-radius:16px;border:1px solid rgba(240,185,42,.55);background:linear-gradient(180deg,#1f1b12,#0d0c0a);color:var(--gold);cursor:pointer}
.stepper output{font-family:var(--num);font-size:2.4rem;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;text-align:center;flex:1;color:var(--silver)}
.recap{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.recap div{display:flex;justify-content:space-between;gap:8px}
.recap .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.recap b{color:var(--gold)}
.reset{font:inherit;border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:8px;cursor:pointer;justify-self:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#050505;color:var(--ink);
  border-top:1.5px solid var(--gold);
  padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-shadow:0 -10px 30px rgba(240,185,42,.18)}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar small{display:block;color:var(--silver);font-size:.8rem;font-style:italic;font-weight:600}
.bar .pp{font-family:var(--num);font-size:2.4rem;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;line-height:1.1;
  background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar .right{text-align:right;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:.9rem}
.confirm button{font:inherit;border-radius:10px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.confirm .yes{background:var(--danger);color:#1a0500;border-color:var(--danger);font-weight:700}
@media (max-width:360px){.item{grid-template-columns:1fr 92px 36px}.bar .pp{font-size:2rem}header h1{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Bouton + feuille de récap partageable */
.sharebtn{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:14px;padding:14px;cursor:pointer;
  background:var(--goldgrad);color:#1a1100;box-shadow:0 6px 20px rgba(240,185,42,.3);
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%}
.sharebtn svg{width:20px;height:20px;stroke:#1a1100;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#recapSheet{position:fixed;inset:0;z-index:60;background:rgba(5,4,2,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:grid;place-items:start center;padding:22px 14px 40px;overflow:auto}
#recapSheet[hidden]{display:none!important}
.rclose{position:fixed;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;z-index:2}
.rsheet{width:100%;max-width:440px;background:linear-gradient(180deg,#171511,#121110);border:1px solid var(--line);
  border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.rhead{padding:26px 22px 20px;text-align:center;border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse 120% 90% at 50% 0%,rgba(240,185,42,.16),transparent 70%)}
.rbrand{font-size:2rem;font-weight:900;font-style:italic;letter-spacing:-.02em;line-height:1}
.rbrand .k1{color:var(--silver)}
.rbrand .k2{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding-right:.14em}
.rtag{color:var(--gold);font-style:italic;font-weight:600;font-size:.9rem;margin-top:4px}
.rdate{color:var(--muted);font-size:.8rem;margin-top:8px}
.rbody{padding:4px 22px}
.rr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rr.col{flex-direction:column;gap:8px}
.rl b{font-weight:700;color:var(--ink)}
.rl small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.rv{font-weight:800;color:var(--gold);white-space:nowrap}
.ilist{width:100%;display:grid;gap:6px}
.il{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem}
.il span:last-child{color:var(--ink);font-weight:600;white-space:nowrap}
.rsub{align-self:flex-end;color:var(--muted);font-size:.85rem}
.rsub b{color:var(--gold)}
.rtotal{display:flex;justify-content:space-between;align-items:center;margin:0 22px;padding:16px 0;
  border-top:2px solid var(--line);font-weight:800;font-size:1.1rem}
.rtotal span:last-child{color:var(--gold)}
.rpers{text-align:center;color:var(--muted);font-size:.9rem;padding:4px 0}
.rpers b{color:var(--ink)}
.rpp{text-align:center;padding:12px 22px 4px}
.rpp small{display:block;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;font-weight:700}
.rppv{font-size:2.6rem;font-weight:900;font-style:italic;line-height:1.15;
  background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding-right:.1em}
.rfoot{text-align:center;color:var(--muted);font-size:.72rem;padding:14px 22px 22px;border-top:1px solid var(--line);margin-top:10px}
</style>

    <div><h1><span class="k1">Kif</span><span class="k2">Kif</span></h1>

  <section class="card" aria-labelledby="t-transport">
    <div class="head">
      <h2 id="t-transport"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><path d="M5 12h14"/><circle cx="8" cy="15" r=".6"/><circle cx="16" cy="15" r=".6"/><path d="M6 17v2M18 17v2"/></svg></span>Transport</h2>

    <div id="carBlock" style="display:grid;gap:14px">
      <div class="seg" role="group" aria-label="Type de véhicule">
        <button type="button" data-type="essence">Essence</button>
        <button type="button" data-type="diesel">Diesel</button>
        <button type="button" data-type="electrique">Électrique</button>
      </div>
      <div class="grid2">
        <label>Consommation
          <div class="unit"><input id="conso" inputmode="decimal" autocomplete="off"><span id="consoUnit">L/100</span></div>
        </label>
        <label>Prix
          <div class="unit"><input id="price" inputmode="decimal" autocomplete="off"><span id="priceUnit">€/L</span></div>
        </label>
      </div>
      <div class="grid2">
        <label>Kilomètres aller-retour
          <div class="unit"><input id="km" inputmode="decimal" autocomplete="off"><span>km</span></div>
        </label>
        <label>Péage aller-retour
          <div class="unit"><input id="toll" inputmode="decimal" autocomplete="off" placeholder="0"><span>€</span></div>
        </label>
      </div>
      <div class="calc" id="calcDetail"></div>
    </div>
  </section>

  <section class="card" aria-labelledby="t-stay">
    <div class="head">
      <h2 id="t-stay"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.8"/></svg></span>Hébergement</h2>
      <span class="sub" id="subStay">0,00 €</span>
    </div>
    <label class="switch"><input type="checkbox" id="withStay"> Hôtel, gîte, location…</label>
    <div id="stayBlock" style="display:grid;gap:14px">
      <div class="grid2">
        <label>Prix par nuit
          <div class="unit"><input id="night" inputmode="decimal" autocomplete="off" placeholder="0"><span>€</span></div>
        </label>
        <label>Nombre de nuits
          <div class="unit"><input id="nights" inputmode="numeric" autocomplete="off" placeholder="1"><span>nuits</span></div>
        </label>
      </div>
      <p class="empty">Indiquez le prix total pour le groupe (toutes les chambres).</p>
    </div>
  </section>

  <section class="card" aria-labelledby="t-courses">
    <div class="head">
      <h2 id="t-courses"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 8H6.5"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>Courses et frais</h2>
      <span class="sub" id="subCourses">0,00 €</span>

    <div class="items" id="items"></div>
    <button type="button" class="add" id="addItem">+ Ajouter un article</button>
  </section>

  <section class="card" aria-labelledby="t-pers">
    <h2 id="t-pers"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/><path d="M6.5 19a5.5 5.5 0 0 1 11 0M1.5 18a4 4 0 0 1 5-3.8M22.5 18a4 4 0 0 0-5-3.8"/></svg></span>Nombre de personnes</h2>
    <div class="stepper">
      <button type="button" id="minus" aria-label="Une personne de moins">−</button>
      <output id="persons" aria-live="polite">4</output>
      <button type="button" id="plus" aria-label="Une personne de plus">+</button>
    </div>
  </section>

  <section class="card" aria-labelledby="t-recap">
    <h2 id="t-recap"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>Récapitulatif</h2>
    <div class="recap" id="recap"></div>
  </section>

  <button type="button" class="sharebtn" id="shareBtn">
    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

    <button type="button" id="no">Annuler</button>
  </div>
</div>

<div class="bar" role="status" aria-live="polite">
  <div class="in">
    <div><small>Chacun paie</small><div class="pp" id="perPerson">0,00 €</div></div>
    <div class="right" id="barRight">Total 0,00 €<br>÷ 4 pers.</div>
  </div>
</div>

<div id="recapSheet" hidden></div>

<script>
(function(){
  var WEAR = 0.10;
  var DEFAULTS = {
    essence:{conso:6.5, price:1.85},
    diesel:{conso:5.5, price:1.75},
    electrique:{conso:17, price:0.25}
  };
  var KEY = 'partage-frais-v1';
  var state = {
    withCar:true, type:'essence',
    params:JSON.parse(JSON.stringify(DEFAULTS)),
    km:250, toll:14.2, persons:4,
    withStay:false, night:120, nights:2,
    items:[
      {name:'Baguettes et viennoiseries', amount:'8,40'},
      {name:'Viande barbecue', amount:'32,90'},
      {name:'Boissons', amount:'18,50'}
    ]
  };
  try{ var s = localStorage.getItem(KEY); if(s){ var p = JSON.parse(s); if(p && p.params) state = Object.assign(state,p); } }catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var fmt = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
  var fmtN = function(n,d){ return n.toLocaleString('fr-FR',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?2:d}); };
  function num(v){ if(v==null) return 0; var n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)&&n>0 ? n : 0; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function show(n){ return String(n).replace('.',','); }
  function escapeHtml(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var LAST = {transport:0,stay:0,courses:0,total:0,pp:0,n:4};
  var TYPE_LABEL = {essence:'Essence', diesel:'Diesel', electrique:'Électrique'};

  function setType(t){
    state.type = t;
    document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.type===t ? 'true':'false'); });
    var el = t==='electrique';
    $('consoUnit').textContent = el ? 'kWh/100' : 'L/100';
    $('priceUnit').textContent = el ? '€/kWh' : '€/L';
    $('conso').value = show(state.params[t].conso);
    $('price').value = show(state.params[t].price);
  }

  function renderItems(){
    var box = $('items'); box.innerHTML = '';
    if(!state.items.length){ var p=document.createElement('p'); p.className='empty'; p.textContent='Aucun article. Ajoutez vos courses, parking, activités…'; box.appendChild(p); }
    state.items.forEach(function(it,i){
      var row = document.createElement('div'); row.className='item';
      var n = document.createElement('input'); n.id='item-name-'+i; n.placeholder='Article'; n.value=it.name; n.setAttribute('aria-label','Article '+(i+1));
      var a = document.createElement('input'); a.id='item-amt-'+i; a.placeholder='0,00 €'; a.inputMode='decimal'; a.value=it.amount; a.setAttribute('aria-label','Montant article '+(i+1));
      var d = document.createElement('button'); d.type='button'; d.className='del'; d.textContent='×'; d.setAttribute('aria-label','Supprimer '+(it.name||'article'));
      n.addEventListener('input',function(){ it.name=n.value; save(); });
      a.addEventListener('input',function(){ it.amount=a.value; update(); });
      a.addEventListener('keydown',function(e){ if(e.key==='Enter'){ addItem(); } });
      d.addEventListener('click',function(){ state.items.splice(i,1); renderItems(); update(); });
      row.append(n,a,d); box.appendChild(row);
    });
  }
  function addItem(){
    state.items.push({name:'',amount:''}); renderItems(); update();
    var last = $('item-name-'+(state.items.length-1)); if(last) last.focus();
  }

  function update(){
    var p = state.params[state.type];
    p.conso = num($('conso').value); p.price = num($('price').value);
    state.km = num($('km').value);
    state.toll = num($('toll').value);
    var el = state.type==='electrique';
    var per100 = p.conso*p.price;
    var energy = p.conso*state.km/100;
    var fuel = energy*p.price;
    var wear = fuel*WEAR;
    var transport = state.withCar ? Math.round((fuel+wear+state.toll)*100)/100 : 0;
    $('carBlock').hidden = !state.withCar;
    $('calcDetail').innerHTML =
      'Coût aux 100 km : <b>'+fmt.format(per100)+'</b><br>'+
      fmtN(energy,1)+(el?' kWh':' L')+' × '+fmtN(p.price,3)+' € = <b>'+fmt.format(fuel)+'</b><br>'+
      'Usure +10 % : <b>'+fmt.format(wear)+'</b><br>'+
      'Péage : <b>'+fmt.format(state.toll)+'</b>';

    state.night = num($('night').value);
    state.nights = num($('nights').value);
    var stay = state.withStay ? Math.round(state.night*state.nights*100)/100 : 0;
    $('stayBlock').hidden = !state.withStay;
    $('subStay').textContent = fmt.format(stay);
    var courses = state.items.reduce(function(s,it){ return s+num(it.amount); },0);
    var total = transport + stay + courses;
    var n = state.persons;
    var pp = Math.ceil(total/n*100 - 1e-9)/100;

    $('subTransport').textContent = fmt.format(transport);
    $('subCourses').textContent = fmt.format(courses);
    $('persons').textContent = n;
    $('perPerson').textContent = fmt.format(pp);
    $('barRight').innerHTML = 'Total '+fmt.format(total)+'<br>÷ '+n+' pers.';
    $('recap').innerHTML =
      '<div><span>Transport'+(state.withCar?'':' (sans véhicule)')+'</span><span>'+fmt.format(transport)+'</span></div>'+
      (state.withStay ? '<div><span>Hébergement ('+fmtN(state.nights,0)+' nuit'+(state.nights>1?'s':'')+')</span><span>'+fmt.format(stay)+'</span></div>' : '')+
      '<div><span>Courses et frais ('+state.items.filter(function(i){return num(i.amount)>0;}).length+')</span><span>'+fmt.format(courses)+'</span></div>'+
      '<div class="tot"><span>Total</span><span>'+fmt.format(total)+'</span></div>'+
      '<div><span>Par personne ('+n+')</span><span><b>'+fmt.format(pp)+'</b></span></div>';
    LAST = {transport:transport, stay:stay, courses:courses, total:total, pp:pp, n:n};
    save();
  }

  function openRecap(){
    update();
    var s = state, L = LAST;
    var dateStr = new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    var rows = '';
    if(s.withCar){
      rows += '<div class="rr"><div class="rl"><b>Transport</b><small>'+TYPE_LABEL[s.type]+' · '+fmtN(s.km,0)+' km'+(s.toll>0?' · péage '+fmt.format(s.toll):'')+'</small></div><div class="rv">'+fmt.format(L.transport)+'</div></div>';
    } else {
      rows += '<div class="rr"><div class="rl"><b>Transport</b><small>Sans véhicule</small></div><div class="rv">'+fmt.format(0)+'</div></div>';
    }
    if(s.withStay){
      rows += '<div class="rr"><div class="rl"><b>Hébergement</b><small>'+fmtN(s.nights,0)+' nuit'+(s.nights>1?'s':'')+' × '+fmt.format(s.night)+'</small></div><div class="rv">'+fmt.format(L.stay)+'</div></div>';
    }
    var items = s.items.filter(function(i){ return num(i.amount)>0; });
    if(items.length){
      var li = '';
      items.forEach(function(it){ li += '<div class="il"><span>'+(escapeHtml(it.name)||'Article')+'</span><span>'+fmt.format(num(it.amount))+'</span></div>'; });
      rows += '<div class="rr col"><div class="rl"><b>Courses et frais</b></div><div class="ilist">'+li+'</div><div class="rsub">Sous-total <b>'+fmt.format(L.courses)+'</b></div></div>';
    }
    var html = '<div class="rsheet">'
      + '<div class="rhead"><div class="rbrand"><span class="k1">Kif</span><span class="k2">Kif</span></div><div class="rtag">On partage les frais !</div><div class="rdate">'+dateStr+'</div></div>'
      + '<div class="rbody">'+rows+'</div>'
      + '<div class="rtotal"><span>Total</span><span>'+fmt.format(L.total)+'</span></div>'
      + '<div class="rpers">Partagé entre <b>'+L.n+'</b> personne'+(L.n>1?'s':'')+'</div>'
      + '<div class="rpp"><small>Chacun paie</small><div class="rppv">'+fmt.format(L.pp)+'</div></div>'
      + '<div class="rfoot">Calculé avec KifKif · parisvtcdriver.com</div>'
      + '</div>';
    var sheet = $('recapSheet');
    sheet.innerHTML = '<button type="button" class="rclose" id="rclose" aria-label="Fermer">×</button>' + html;
    sheet.hidden = false;
    document.body.style.overflow = 'hidden';
    $('rclose').addEventListener('click', closeRecap);
  }
  function closeRecap(){ $('recapSheet').hidden = true; document.body.style.overflow = ''; }

  // Wiring
  document.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click',function(){ setType(b.dataset.type); update(); }); });
  $('withStay').addEventListener('change',function(){ state.withStay=this.checked; update(); });
  ['conso','price','km','toll','night','nights'].forEach(function(id){ $(id).addEventListener('input',update); });
  $('withCar').addEventListener('change',function(){ state.withCar=this.checked; update(); });
  $('addItem').addEventListener('click',addItem);
  $('minus').addEventListener('click',function(){ if(state.persons>1){ state.persons--; update(); } });
  $('plus').addEventListener('click',function(){ if(state.persons<99){ state.persons++; update(); } });
  $('shareBtn').addEventListener('click',openRecap);
  $('recapSheet').addEventListener('click',function(e){ if(e.target===this) closeRecap(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('recapSheet').hidden) closeRecap(); });
  $('reset').addEventListener('click',function(){ $('confirm').hidden=false; $('reset').hidden=true; });
  $('no').addEventListener('click',function(){ $('confirm').hidden=true; $('reset').hidden=false; });
  $('yes').addEventListener('click',function(){
    state.items=[]; state.km=0; state.toll=0; $('km').value=''; $('toll').value='';
    state.withStay=false; $('withStay').checked=false;
    $('confirm').hidden=true; $('reset').hidden=false; renderItems(); update();
  });

  // Init
  $('withCar').checked = state.withCar;
  $('km').value = state.km ? show(state.km) : '';
  $('toll').value = state.toll ? show(state.toll) : '';
  $('withStay').checked = state.withStay;
  $('night').value = state.night ? show(state.night) : '';
  $('nights').value = state.nights ? show(state.nights) : '';
  setType(state.type);
  renderItems();
  update();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
